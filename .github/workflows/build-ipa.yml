name: Build VLC iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Cachear CocoaPods y SPM
        uses: actions/cache@v4
        with:
          path: |
            Pods
            build_output/SourcePackages
          key: ${{ runner.os }}-pods-spm-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-spm-

      - name: 3. Instalar dependencias (CocoaPods)
        run: |
          pod install --repo-update

      - name: 4. Limpiar extensiones conflictivas (watchOS / Widgets) para IPA sin firma
        run: |
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("VLC.xcodeproj")
          ios_target = project.targets.find { |t| t.name == "VLC-iOS" }
          if ios_target
            # Quitar dependencias de watchOS, Widget y ShareExtension que chocan sin firma
            ios_target.dependencies.reject! { |d| ["VLC-watchOS", "VLC-ShareExtension", "MediaLibraryWidgetExtension"].include?(d.target.name) }
            # Quitar fases de copiado de Watch y App Extensions
            ios_target.copy_files_build_phases.reject! { |p| ["Embed Watch Content", "Embed App Extensions", "Embed Foundation Extensions"].include?(p.name) }
          end
          project.save
          '

      - name: 5. Compilar VLC para iOS (Sin firma de Apple)
        run: |
          xcodebuild build \
            -workspace VLC.xcworkspace \
            -scheme "VLC-iOS" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 6. Empaquetar en formato .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "Empaquetando aplicación encontrada en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -q VLC-LiquidGlass.ipa Payload

      - name: 7. Subir el .ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VLC-LiquidGlass-IPA
          path: VLC-LiquidGlass.ipa
