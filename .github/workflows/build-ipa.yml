name: Build VLC iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-ios:
    runs-on: macos-15
    
    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Seleccionar Xcode 16.1 (Estable para iOS)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          xcodebuild -version

      - name: 3. Cachear CocoaPods y SPM
        uses: actions/cache@v4
        with:
          path: |
            Pods
            build_output/SourcePackages
          key: ${{ runner.os }}-pods-spm-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-spm-

      - name: 4. Instalar dependencias (CocoaPods)
        run: |
          pod install --repo-update

      - name: 5. Eliminar extensiones (Watch, Widget y Share) del proyecto
        run: |
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("VLC.xcodeproj")
          ext_names = ["VLC-watchOS", "VLC-ShareExtension", "MediaLibraryWidgetExtension"]
          
          ios_target = project.targets.find { |t| t.name == "VLC-iOS" }
          if ios_target
            ios_target.dependencies.reject! { |d| d.target && ext_names.include?(d.target.name) }
            ios_target.copy_files_build_phases.each do |phase|
              phase.files.reject! do |build_file|
                name = build_file.display_name.to_s
                name.include?(".appex") || name.include?("Watch") || name.include?("Widget")
              end
            end
          end

          project.targets.reject! { |t| ext_names.include?(t.name) }
          project.save
          puts "Extensiones eliminadas con éxito"
          '

      - name: 6. Compilar VLC para iOS (Sin firma de Apple)
        run: |
          xcodebuild build \
            -workspace VLC.xcworkspace \
            -scheme "VLC-iOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 7. Empaquetar en formato .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "Empaquetando aplicación encontrada en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -q VLC-LiquidGlass.ipa Payload

      - name: 8. Subir el .ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VLC-LiquidGlass-IPA
          path: VLC-LiquidGlass.ipa
