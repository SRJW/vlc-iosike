name: Build VLC iOS IPA

on:
  workflow_dispatch: # Te permite ejecutarlo con un botón manual en GitHub
  push:
    branches:
      - master
      - main

jobs:
  build-ios:
    runs-on: macos-14 # Runner de macOS con Xcode preinstalado
    
    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Cachear CocoaPods (Acelera futuras compilaciones)
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 3. Instalar dependencias (VLCKit)
        run: |
          pod install --repo-update

      - name: 4. Compilar VLC para iOS (Sin firma de Apple)
        run: |
          xcodebuild build \
            -workspace VLC.xcworkspace \
            -scheme "VLC-iOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 5. Empaquetar en formato .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Empaquetando aplicación encontrada en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -q VLC-Custom.ipa Payload

      - name: 6. Subir el .ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: VLC-iOS-IPA
          path: VLC-Custom.ipa
